  <text x="64" y="176" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="60" font-weight="800" fill="#ffffff">Mr. Lowprofile</text>
  <text x="64" y="222" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#d8c9dd">Software Developer &#183; Java &amp; Python &#183; PS5 homebrew</text>
  <text x="1136" y="222" text-anchor="end" font-family="JetBrains Mono, ui-monospace, monospace" font-size="20" fill="#a99fb8">@MrLowPr</text>
