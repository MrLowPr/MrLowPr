<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="The Ultimate CTF Utils — six CTF triage tools in one npm package">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04140f"/>
      <stop offset="0.5" stop-color="#07251a"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="0.55" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.62">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- left accent bar -->
  <rect x="96" y="152" width="104" height="8" rx="4" fill="url(#accent)"/>

  <!-- title -->
  <text x="96" y="246" font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace" font-size="64" font-weight="800" fill="#ffffff">THE ULTIMATE</text>
  <text x="96" y="326" font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace" font-size="64" font-weight="800" fill="url(#accent)">CTF UTILS</text>

  <text x="96" y="382" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#cde8dd">Six triage tools in one npm package</text>

  <!-- terminal prompt -->
  <g transform="translate(96 420)">
    <rect x="0" y="0" width="536" height="52" rx="10" fill="#000000" fill-opacity="0.34" stroke="#34d399" stroke-opacity="0.42"/>
    <text x="20" y="34" font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace" font-size="23">
      <tspan fill="#34d399">$</tspan><tspan fill="none"> </tspan><tspan fill="#e6f6ef">npm i -g the-ultimate-ctf-utils</tspan>
    </text>
  </g>

  <!-- field chips -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700">
    <g transform="translate(96 508)">
      <rect x="0" y="0" width="150" height="42" rx="21" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="75" y="27" text-anchor="middle" fill="#a7f3d0">Web</text>
    </g>
    <g transform="translate(260 508)">
      <rect x="0" y="0" width="150" height="42" rx="21" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="75" y="27" text-anchor="middle" fill="#a5f3fc">Crypto</text>
    </g>
    <g transform="translate(424 508)">
      <rect x="0" y="0" width="132" height="42" rx="21" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="66" y="27" text-anchor="middle" fill="#ddd6fe">Reverse</text>
    </g>
    <g transform="translate(570 508)">
      <rect x="0" y="0" width="120" height="42" rx="21" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.5"/>
      <text x="60" y="27" text-anchor="middle" fill="#fde68a">Pwn</text>
    </g>
    <g transform="translate(704 508)">
      <rect x="0" y="0" width="150" height="42" rx="21" fill="#34d399" fill-opacity="0.14" stroke="#34d399" stroke-opacity="0.5"/>
      <text x="75" y="27" text-anchor="middle" fill="#a7f3d0">Forensics</text>
    </g>
    <g transform="translate(868 508)">
      <rect x="0" y="0" width="150" height="42" rx="21" fill="#22d3ee" fill-opacity="0.14" stroke="#22d3ee" stroke-opacity="0.5"/>
      <text x="75" y="27" text-anchor="middle" fill="#a5f3fc">Stego</text>
    </g>
  </g>

  <!-- side panel: command list -->
  <g transform="translate(744 150)" font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace" font-size="20">
    <rect x="0" y="0" width="440" height="292" rx="14" fill="#000000" fill-opacity="0.3" stroke="#22d3ee" stroke-opacity="0.28"/>
    <text x="26" y="40" font-size="19" fill="#7dd3fc">ctf-utils list</text>
    <g fill="#cbd5e1">
      <text x="26" y="82">webparamtrace</text>
      <text x="26" y="116">cryptoattack-triage</text>
      <text x="26" y="150">pyunpack-trace</text>
      <text x="26" y="184">heapviz</text>
      <text x="26" y="218">pcap-stream-extractor</text>
      <text x="26" y="252">audio-stego-analyzer</text>
    </g>
    <rect x="0" y="0" width="4" height="292" rx="2" fill="url(#accent)" fill-opacity="0.65"/>
  </g>

  <text x="96" y="600" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8fb3a5">github.com/MrLowPr/The-Ultimate-CTF-Utils</text>
  <text x="1184" y="600" text-anchor="end" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#6ee7b7">MIT</text>
</svg>