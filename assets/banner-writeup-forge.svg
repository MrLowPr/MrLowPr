<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="WriteUp Forge — generator write-up CTF offline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03110a"/>
      <stop offset="0.5" stop-color="#0a2315"/>
      <stop offset="1" stop-color="#050c09"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2bff88"/>
      <stop offset="0.55" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.22" r="0.62">
      <stop offset="0" stop-color="#2bff88" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2bff88" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" fill-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>

  <!-- left accent bar -->
  <rect x="96" y="152" width="104" height="8" rx="4" fill="url(#accent)"/>

  <!-- title -->
  <text x="96" y="246" font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace" font-size="64" font-weight="800" fill="#ffffff">WRITEUP</text>
  <text x="96" y="326" font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace" font-size="64" font-weight="800" fill="url(#accent)">FORGE</text>

  <text x="96" y="382" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="27" fill="#c8f7d8">Generator write-up CTF — offline, zero dependency</text>

  <!-- terminal prompt -->
  <g transform="translate(96 420)">
    <rect x="0" y="0" width="600" height="52" rx="10" fill="#000000" fill-opacity="0.34" stroke="#2bff88" stroke-opacity="0.42"/>
    <text x="20" y="34" font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace" font-size="20">
      <tspan fill="#2bff88">$</tspan><tspan fill="none"> </tspan><tspan fill="#e2f8ea">forge --export html,pdf,md --checklist</tspan>
    </text>
  </g>

  <!-- field chips -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="700">
    <g transform="translate(96 508)">
      <rect x="0" y="0" width="112" height="42" rx="21" fill="#2bff88" fill-opacity="0.14" stroke="#2bff88" stroke-opacity="0.5"/>
      <text x="56" y="27" text-anchor="middle" fill="#a7f3d0">Offline</text>
    </g>
    <g transform="translate(224 508)">
      <rect x="0" y="0" width="152" height="42" rx="21" fill="#7dd3fc" fill-opacity="0.14" stroke="#7dd3fc" stroke-opacity="0.5"/>
      <text x="76" y="27" text-anchor="middle" fill="#a5f3fc">HTML Export</text>
    </g>
    <g transform="translate(392 508)">
      <rect x="0" y="0" width="190" height="42" rx="21" fill="#a78bfa" fill-opacity="0.14" stroke="#a78bfa" stroke-opacity="0.5"/>
      <text x="95" y="27" text-anchor="middle" fill="#ddd6fe">Markdown + ZIP</text>
    </g>
    <g transform="translate(598 508)">
      <rect x="0" y="0" width="146" height="42" rx="21" fill="#fbbf24" fill-opacity="0.14" stroke="#fbbf24" stroke-opacity="0.5"/>
      <text x="73" y="27" text-anchor="middle" fill="#fde68a">Print / PDF</text>
    </g>
  </g>

  <!-- side panel: report outline -->
  <g transform="translate(820 150)" font-family="JetBrains Mono, SFMono-Regular, Consolas, Menlo, monospace">
    <rect x="0" y="0" width="364" height="292" rx="14" fill="#000000" fill-opacity="0.3" stroke="#2bff88" stroke-opacity="0.28"/>
    <text x="26" y="42" font-size="19" fill="#86efac">report.outline</text>
    <g font-size="19" fill="#d1fae5">
      <text x="26" y="88">01  profile &amp; event</text>
      <text x="26" y="124">02  challenge &amp; recon</text>
      <text x="26" y="160">03  solve steps</text>
      <text x="26" y="196">04  script &amp; flag</text>
      <text x="26" y="232">05  mitigation</text>
      <text x="26" y="268">06  lessons &amp; refs</text>
    </g>
    <rect x="0" y="0" width="4" height="292" rx="2" fill="url(#accent)" fill-opacity="0.65"/>
  </g>

  <text x="96" y="600" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#8fb3a5">github.com/MrLowPr/writeup-forge</text>
  <text x="1184" y="600" text-anchor="end" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="21" fill="#4ade80">MIT</text>
</svg>
